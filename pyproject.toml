[project]
name = "t2s"
version = "1.0.0"
description = "Self-correcting text-to-SQL agent (Qwen2.5-Coder 1.5B via Ollama) evaluated on Spider 1.0"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["third_party", "spider", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=) is not needed for the equal-length pairs used here
